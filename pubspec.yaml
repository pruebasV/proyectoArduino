name: proyecto
description: "Aplicación para control de invernadero"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0
  animated_text_kit: ^4.2.2
  shimmer: ^3.0.0
  flutter_svg: ^2.0.7
  url_launcher: ^6.1.11
  intl: ^0.18.1
  http: ^1.1.0
  mailer: ^6.0.0  # Versión corregida
  firebase_core: ^2.24.0
  cloud_firestore: ^4.15.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/fonts/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icono.jpg"